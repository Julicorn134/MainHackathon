# Copy to secrets.toml in this directory. The real file is ignored by Git.
# Cloud uploads. Copy the server secret from Supabase > Settings > API Keys.
# Keep real values only in secrets.toml or in the deployment's secret store.
BLOODSIGHT_DATA_BACKEND = "supabase" # use "sqlite" for offline use and tests
SUPABASE_URL = "https://PROJECT.supabase.co"
SUPABASE_SECRET_KEY = ""
# Legacy SUPABASE_SERVICE_ROLE_KEY is also accepted; a publishable/anon key is not.
